name: Windows Portable EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r policem_real_app/requirements.txt pyinstaller
      - name: Build Windows app
        working-directory: policem_real_app
        run: |
          pyinstaller --noconfirm --clean --onedir --name Policem --add-data "static;static" --collect-all fitz --collect-all pymupdf --collect-all uvicorn --collect-all multipart --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on windows_main.py
      - name: Archive portable app
        shell: pwsh
        run: |
          Compress-Archive -Path policem_real_app/dist/Policem/* -DestinationPath Policem_Windows_Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Policem_Windows_Portable
          path: Policem_Windows_Portable.zip
